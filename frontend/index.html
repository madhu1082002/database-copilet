<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="GenAI-Powered Data Ops Assistant for pipeline monitoring and optimization" />
  <title>DataOps Copilot</title>
  <script>
    (function () {
      var t = localStorage.getItem("dataops-theme");
      if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
          </svg>
        </div>
        <div>
          <h1>DataOps Copilot</h1>
          <p class="subtitle">GenAI-Powered Data Ops Assistant</p>
        </div>
      </div>
      <div class="header-meta">
        <span class="badge" id="source-badge">
          <span class="badge-dot" id="source-dot"></span>
          S3-D-08 · Loading...
        </span>
        <button class="theme-toggle" id="theme-toggle" title="Toggle light/dark theme" aria-label="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <button class="refresh-btn" id="refresh-btn" title="Refresh dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.85 1.05 6.5 2.74"/><path d="M21 3v6h-6"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="main">
      <section class="dashboard" id="dashboard">
        <div class="section-header">
          <h2>Pipeline Dashboard</h2>
          <span class="last-updated" id="last-updated"></span>
        </div>
        <div class="stats-grid" id="stats-grid">
          <div class="stat-card skeleton skeleton-stat"></div>
          <div class="stat-card skeleton skeleton-stat"></div>
          <div class="stat-card skeleton skeleton-stat"></div>
          <div class="stat-card skeleton skeleton-stat"></div>
        </div>
        <div class="pipeline-list-header">
          <span>Recent Runs</span>
          <span class="pipeline-count" id="pipeline-count"></span>
        </div>
        <div class="list-toolbar">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="search" id="pipeline-search" placeholder="Search pipelines by name, status, cluster..." autocomplete="off" />
          </div>
        </div>
        <div class="pipeline-list" id="pipeline-list">
          <div class="skeleton skeleton-pipeline"></div>
          <div class="skeleton skeleton-pipeline"></div>
          <div class="skeleton skeleton-pipeline"></div>
        </div>
      </section>

      <section class="chat-panel">
        <div class="chat-header">
          <h2>Ask DataOps Copilot</h2>
          <select id="category-select" class="category-select">
            <option value="">Auto-detect category</option>
            <option value="pipeline_status">Pipeline Status</option>
            <option value="failure_diagnosis">Failure Diagnosis</option>
            <option value="optimization">Optimization</option>
          </select>
        </div>

        <div class="chat-messages" id="chat-messages">
          <div class="message assistant">
            <div class="message-avatar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/>
              </svg>
            </div>
            <div class="message-content">
              <p>Hello! I'm <strong>DataOps Copilot</strong>. Ask me about pipeline status, failure diagnosis, or cost optimization.</p>
              <div class="suggestions">
                <button class="suggestion" data-query="Did sales_etl run today?">Did sales_etl run today?</button>
                <button class="suggestion" data-query="Why did customer_ingestion fail?">Why did customer_ingestion fail?</button>
                <button class="suggestion" data-query="Can we reduce compute costs?">Can we reduce compute costs?</button>
              </div>
            </div>
          </div>
        </div>

        <form class="chat-input-form" id="chat-form">
          <input
            type="text"
            id="chat-input"
            placeholder="Ask a question... e.g. Which pipelines failed last night?"
            autocomplete="off"
          />
          <button type="submit" id="send-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
            Send
          </button>
        </form>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
